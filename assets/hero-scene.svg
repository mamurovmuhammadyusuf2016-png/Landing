<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 120 690 430" role="img" aria-label="Arab tili darsligi, mashrabiya ravoq va zaytun novdasi">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EA"/>
      <stop offset="1" stop-color="#F1E8D6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE5D1"/>
      <stop offset="1" stop-color="#E5D9C2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#F7EFD9" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="vaseBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EADCC4"/>
      <stop offset=".45" stop-color="#DAC6A2"/>
      <stop offset="1" stop-color="#C4AE87"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0E7D5"/>
      <stop offset="1" stop-color="#FEFCF6"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FEFCF6"/>
      <stop offset="1" stop-color="#EFE5D2"/>
    </linearGradient>
    <linearGradient id="penG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7CD7A"/>
      <stop offset=".5" stop-color="#B98A2E"/>
      <stop offset="1" stop-color="#8E681F"/>
    </linearGradient>

    <path id="archPath" d="M498 430 L498 168 A56 56 0 0 1 610 168 L610 430 Z"/>
    <clipPath id="archClip"><use href="#archPath"/></clipPath>

    <path id="panelPath" d="M352 452 L352 305 A52 52 0 0 1 456 305 L456 452 Z"/>
    <clipPath id="panelClip"><use href="#panelPath"/></clipPath>

    <pattern id="lattice" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M13 0 V26 M0 13 H26" stroke="#C9AE72" stroke-width="2.2" opacity=".55" fill="none"/>
      <circle cx="13" cy="13" r="4.6" fill="none" stroke="#C9AE72" stroke-width="2.2" opacity=".55"/>
    </pattern>
  </defs>

  <!-- ===== room ===== -->
  <rect width="800" height="620" fill="url(#wall)"/>
  <rect y="452" width="800" height="168" fill="url(#floor)"/>
  <line x1="0" y1="452" x2="800" y2="452" stroke="#DCCEB4" stroke-width="1.5"/>

  <!-- ===== arched window with light ===== -->
  <use href="#archPath" fill="url(#glow)"/>
  <g clip-path="url(#archClip)">
    <rect x="490" y="150" width="130" height="290" fill="url(#lattice)" opacity=".5"/>
  </g>
  <use href="#archPath" fill="none" stroke="#DCCBAA" stroke-width="3"/>

  <!-- light spilling from the window onto the wall and floor -->
  <g opacity=".4">
    <path d="M470 452 L300 452 L470 240 Z" fill="#FFFDF4" opacity=".45"/>
    <path d="M300 452 L400 452 L330 545 L210 545 Z" fill="#FFFBEF" opacity=".4"/>
    <path d="M400 452 L470 452 L430 545 L330 545 Z" fill="#FFFBEF" opacity=".25"/>
  </g>

  <!-- ===== standing mashrabiya arch panel ===== -->
  <g>
    <ellipse cx="404" cy="455" rx="86" ry="9" fill="#CBBA9B" opacity=".45"/>
    <path d="M338 452 L338 300 A66 66 0 0 1 470 300 L470 452 Z" fill="#F3EAD8" stroke="#D9C7A4" stroke-width="3"/>
    <use href="#panelPath" fill="#FBF6EA"/>
    <g clip-path="url(#panelClip)">
      <rect x="345" y="245" width="120" height="215" fill="url(#lattice)" opacity=".8"/>
    </g>
    <use href="#panelPath" fill="none" stroke="#D9C7A4" stroke-width="2.5"/>
  </g>

  <!-- ===== vase with olive branches ===== -->
  <g transform="translate(-54 0)">
    <g stroke="#5E7A5A" fill="none" stroke-linecap="round">
      <path d="M646 356 C640 300 628 258 604 214" stroke-width="3.4"/>
      <path d="M652 356 C662 306 680 268 712 232" stroke-width="3"/>
      <path d="M649 352 C650 312 654 280 660 246" stroke-width="2.6"/>
    </g>
    <g fill="#6E8C67">
      <ellipse cx="620" cy="252" rx="15" ry="6.5" transform="rotate(-38 620 252)"/>
      <ellipse cx="612" cy="284" rx="14" ry="6" transform="rotate(-20 612 284)"/>
      <ellipse cx="634" cy="272" rx="13" ry="5.6" transform="rotate(-62 634 272)"/>
      <ellipse cx="604" cy="224" rx="13.5" ry="6" transform="rotate(-48 604 224)"/>
      <ellipse cx="628" cy="312" rx="12.5" ry="5.4" transform="rotate(-14 628 312)"/>
      <ellipse cx="686" cy="256" rx="15" ry="6.5" transform="rotate(34 686 256)" fill="#7B9873"/>
      <ellipse cx="704" cy="238" rx="14" ry="6" transform="rotate(46 704 238)" fill="#7B9873"/>
      <ellipse cx="668" cy="288" rx="13.5" ry="5.8" transform="rotate(22 668 288)" fill="#7B9873"/>
      <ellipse cx="694" cy="284" rx="12.5" ry="5.4" transform="rotate(58 694 284)" fill="#6E8C67"/>
      <ellipse cx="658" cy="264" rx="12" ry="5.2" transform="rotate(6 658 264)" fill="#84A079"/>
      <ellipse cx="654" cy="300" rx="12.5" ry="5.4" transform="rotate(-8 654 300)" fill="#84A079"/>
      <ellipse cx="664" cy="228" rx="11.5" ry="5" transform="rotate(18 664 228)" fill="#84A079"/>
    </g>

    <ellipse cx="654" cy="455" rx="62" ry="10" fill="#CBBA9B" opacity=".5"/>
    <path d="M614 372 C606 400 606 430 618 450 C630 462 678 462 690 450 C702 430 702 400 694 372 C688 356 620 356 614 372 Z" fill="url(#vaseBody)"/>
    <path d="M632 358 L676 358 L672 376 L636 376 Z" fill="#D9C4A0"/>
    <ellipse cx="654" cy="357" rx="23" ry="7" fill="#E9DAC0"/>
    <ellipse cx="654" cy="357" rx="15" ry="4.2" fill="#C2AB83"/>
    <g stroke="#C0A87F" stroke-width="1.6" opacity=".55" fill="none">
      <path d="M617 392 C640 399 668 399 691 392"/>
      <path d="M613 410 C640 418 668 418 695 410"/>
      <path d="M615 428 C640 436 668 436 693 428"/>
    </g>
    <path d="M626 374 C620 400 620 428 630 446" stroke="#F6ECD8" stroke-width="6" fill="none" opacity=".55" stroke-linecap="round"/>
  </g>

  <!-- ===== open book ===== -->
  <g transform="translate(14 6) scale(1.22) translate(-52 -92)">
    <ellipse cx="286" cy="512" rx="150" ry="15" fill="#CBBA9B" opacity=".45"/>
    <path d="M150 500 C196 470 250 466 286 480 L286 500 C250 486 196 490 150 518 Z" fill="#E3D6BC"/>
    <path d="M422 500 C376 470 322 466 286 480 L286 500 C322 486 376 490 422 518 Z" fill="#E3D6BC"/>
    <path d="M152 496 C198 466 250 462 286 476 C322 462 374 466 420 496 C374 480 322 478 286 492 C250 478 198 480 152 496 Z" fill="#D8C9AB"/>
    <path d="M156 492 C200 464 250 460 286 474 L286 490 C250 476 200 480 156 506 Z" fill="url(#pageL)"/>
    <path d="M416 492 C372 464 322 460 286 474 L286 490 C322 476 372 480 416 506 Z" fill="url(#pageR)"/>
    <g stroke="#9C8C6E" stroke-width="2.4" stroke-linecap="round" opacity=".55">
      <path d="M196 484 H268"/>
      <path d="M182 492 H268"/>
      <path d="M188 500 H262"/>
      <path d="M176 509 H256"/>
    </g>
    <g stroke="#9C8C6E" stroke-width="2.4" stroke-linecap="round" opacity=".55">
      <path d="M306 484 H378"/>
      <path d="M306 492 H392"/>
      <path d="M312 500 H386"/>
      <path d="M318 509 H398"/>
    </g>
    <path d="M280 476 C284 484 284 486 280 492 C292 486 292 482 280 476 Z" fill="#C9B896" opacity=".7"/>

    <g transform="rotate(-14 360 496)">
      <rect x="306" y="490" width="104" height="7.5" rx="3.75" fill="url(#penG)"/>
      <path d="M410 490 L424 493.75 L410 497.5 Z" fill="#8E681F"/>
      <rect x="330" y="490" width="9" height="7.5" fill="#8E681F" opacity=".55"/>
    </g>
  </g>
</svg>
